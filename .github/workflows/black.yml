name: Black

on: push

permissions:
  contents: read
jobs:
  black:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: psf/black@35ea67920b7f6ac8e09be1c47278752b1e827f76 # stable
        with:
          version: "22.3.0"
          options: "--check"
